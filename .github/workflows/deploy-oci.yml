name: Deploy to OCI

on:
  workflow_dispatch:
  push:
    branches: [ "develop" ]

permissions:
  contents: read
  actions: write
  packages: write

concurrency:
  group: deploy-oci
  cancel-in-progress: false

jobs:
  deploy:
    name: Build images and deploy API + Worker
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Test and build all modules
        run: ./gradlew clean :keepgoing-api:test :keepgoing-worker:test :keepgoing-api:bootJar :keepgoing-worker:bootJar --no-daemon

      - name: Resolve API image metadata
        run: |
          set -euo pipefail
          image_name="ghcr.io/${GITHUB_REPOSITORY_OWNER}/keepgoing-be-api"
          image_name="$(printf '%s' "$image_name" | tr '[:upper:]' '[:lower:]')"
          image_tag="${GITHUB_SHA::12}"

          echo "API_IMAGE=$image_name" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=$image_tag" >> "$GITHUB_ENV"

      - name: Resolve Worker image metadata
        run: |
          set -euo pipefail
          worker_image="ghcr.io/${GITHUB_REPOSITORY_OWNER}/keepgoing-be-worker"
          worker_image="$(printf '%s' "$worker_image" | tr '[:upper:]' '[:lower:]')"

          echo "WORKER_IMAGE=$worker_image" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Stage pre-built JARs for Docker
        run: |
          set -euo pipefail
          cp keepgoing-api/build/libs/keepgoing-api-*.jar .docker/api.jar
          cp keepgoing-worker/build/libs/keepgoing-worker-*.jar .docker/worker.jar

      - name: Build and push API linux/arm64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: api-runtime
          platforms: linux/arm64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.API_IMAGE }}:${{ env.IMAGE_TAG }}
            ${{ env.API_IMAGE }}:latest

      - name: Build and push Worker linux/arm64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: worker-runtime
          platforms: linux/arm64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.WORKER_IMAGE }}:${{ env.IMAGE_TAG }}
            ${{ env.WORKER_IMAGE }}:latest

      - name: Prepare SSH
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
          OCI_SSH_PRIVATE_KEY_B64: ${{ secrets.OCI_SSH_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s' "$OCI_SSH_PRIVATE_KEY_B64" | base64 -d > ~/.ssh/oci_key
          chmod 600 ~/.ssh/oci_key

          ssh-keyscan -H "$OCI_HOST" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Sync config files to server
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
          OCI_USER: ${{ secrets.OCI_USER }}
        run: |
          set -euo pipefail
          scp -i ~/.ssh/oci_key \
            docker-compose.prod.yml \
            "$OCI_USER@$OCI_HOST:/srv/keepgoing/docker-compose.prod.yml"
          ssh -i ~/.ssh/oci_key "$OCI_USER@$OCI_HOST" \
            "mkdir -p /srv/keepgoing/infra/scripts /srv/keepgoing/infra/nginx"
          scp -i ~/.ssh/oci_key \
            infra/scripts/deploy-prod.sh infra/scripts/deploy-prod-tls.sh \
            "$OCI_USER@$OCI_HOST:/srv/keepgoing/infra/scripts/"
          scp -i ~/.ssh/oci_key \
            docker-compose.prod.tls.yml \
            "$OCI_USER@$OCI_HOST:/srv/keepgoing/docker-compose.prod.tls.yml"
          scp -i ~/.ssh/oci_key \
            infra/nginx/keepgoing.conf \
            "$OCI_USER@$OCI_HOST:/srv/keepgoing/infra/nginx/keepgoing.conf"
          scp -i ~/.ssh/oci_key \
            infra/nginx/keepgoing.tls.conf.template \
            "$OCI_USER@$OCI_HOST:/srv/keepgoing/infra/nginx/keepgoing.tls.conf.template"
          ssh -i ~/.ssh/oci_key "$OCI_USER@$OCI_HOST" \
            "sudo rm -rf /srv/keepgoing/monitoring && mkdir -p /srv/keepgoing/monitoring"
          scp -i ~/.ssh/oci_key -r \
            monitoring \
            "$OCI_USER@$OCI_HOST:/srv/keepgoing/"

      - name: Deploy on OCI
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
          OCI_USER: ${{ secrets.OCI_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/oci_key "$OCI_USER@$OCI_HOST" \
            "API_IMAGE='$API_IMAGE' WORKER_IMAGE='$WORKER_IMAGE' IMAGE_TAG='$IMAGE_TAG' bash -s" <<'REMOTE'
          set -euo pipefail

          cd /srv/keepgoing

          for file in .env.prod .env.app .env.db docker-compose.prod.yml; do
            if [ ! -f "$file" ]; then
              echo "required deployment file not found: /srv/keepgoing/$file" >&2
              echo "Run the initial server bootstrap manually before enabling CD." >&2
              exit 1
            fi
          done

          set_env() {
            key="$1"
            value="$2"
            file=".env.prod"

            if grep -q "^${key}=" "$file"; then
              sed -i "s|^${key}=.*|${key}=${value}|" "$file"
            else
              printf '\n%s=%s\n' "$key" "$value" >> "$file"
            fi
          }

          get_env() {
            key="$1"
            grep -E "^${key}=" .env.prod | tail -n 1 | cut -d= -f2- || true
          }

          set_env APP_IMAGE "$API_IMAGE"
          set_env APP_IMAGE_TAG "$IMAGE_TAG"
          set_env WORKER_IMAGE "$WORKER_IMAGE"
          set_env WORKER_IMAGE_TAG "$IMAGE_TAG"
          set_env DEPLOY_TLS_ENABLED "true"

          compose_files=(-f docker-compose.prod.yml)
          tls_enabled="$(get_env DEPLOY_TLS_ENABLED)"
          if [ "$tls_enabled" = "true" ]; then
            if [ ! -f docker-compose.prod.tls.yml ]; then
              echo "DEPLOY_TLS_ENABLED=true but docker-compose.prod.tls.yml is missing" >&2
              exit 1
            fi
            compose_files+=(-f docker-compose.prod.tls.yml)
          fi

          docker compose --env-file .env.prod "${compose_files[@]}" pull app worker
          docker compose --env-file .env.prod "${compose_files[@]}" up -d
          docker compose --env-file .env.prod "${compose_files[@]}" ps

          curl -fsS http://127.0.0.1/healthz
          docker compose --env-file .env.prod "${compose_files[@]}" exec -T app \
            curl -fsS http://127.0.0.1:8080/actuator/health
          REMOTE
