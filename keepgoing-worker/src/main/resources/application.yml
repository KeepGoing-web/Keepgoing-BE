spring:
  application:
    name: keepgoing-worker
  main:
    web-application-type: none
  lifecycle:
    timeout-per-shutdown-phase: 50s
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

image-processing:
  streams:
    request: ${IMAGE_PROCESSING_REQUEST_STREAM:note-image-processing-requests}
    result: ${IMAGE_PROCESSING_RESULT_STREAM:note-image-processing-results}
    request-group: ${IMAGE_PROCESSING_REQUEST_GROUP:keepgoing-worker}
    request-consumer: ${IMAGE_PROCESSING_REQUEST_CONSUMER:worker-1}
    enabled: ${IMAGE_PROCESSING_STREAMS_ENABLED:true}

storage:
  endpoint: ${STORAGE_ENDPOINT}
  access-key: ${STORAGE_ACCESS_KEY}
  secret-key: ${STORAGE_SECRET_KEY}
  region: ${STORAGE_REGION}
  bucket-names:
    quarantine: ${STORAGE_BUCKET_QUARANTINE}
    secure: ${STORAGE_BUCKET_SECURE}