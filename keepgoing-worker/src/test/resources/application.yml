spring:
  application:
    name: keepgoing-worker-test
  main:
    web-application-type: none
  data:
    redis:
      host: localhost
      port: 6379

image-processing:
  streams:
    request: note-image-processing-requests-test
    result: note-image-processing-results-test
    request-group: keepgoing-worker-test
    request-consumer: worker-test-1
    enabled: false
    dlq: image-processing-dlq-test
    max-retries: 3
    pending-batch-size: 10

storage:
  endpoint: http://localhost:9000
  access-key: test-access-key
  secret-key: test-secret-key
  region: us-east-1
  bucket-names:
    quarantine: test-quarantine-bucket
    secure: test-secure-bucket
