services:
  postgres:
    image: postgres:17-alpine
    container_name: keepgoing-postgres
    restart: unless-stopped
    shm_size: 256m
    mem_limit: 1024m
    env_file:
      - ./.env.db
    environment:
      TZ: ${TZ:-Asia/Seoul}
    volumes:
      - ${POSTGRES_DATA_DIR:-./var/postgres-data}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - keepgoing-net

  redis:
    image: redis:7-alpine
    container_name: keepgoing-redis
    restart: unless-stopped
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    volumes:
      - ${REDIS_DATA_DIR:-./var/redis-data}:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - keepgoing-net

  app:
    image: ${APP_IMAGE:-ghcr.io/keepgoing-web/keepgoing-be-api}:${APP_IMAGE_TAG:-latest}
    container_name: keepgoing-app
    restart: unless-stopped
    mem_limit: 1536m
    env_file:
      - ./.env.db
      - ./.env.app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Asia/Seoul}
      REDIS_HOST: redis
      IMAGE_PROCESSING_STREAMS_ENABLED: "true"
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/actuator/health | grep '\"status\":\"UP\"' > /dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - keepgoing-net

  nginx:
    image: nginx:1.27-alpine
    container_name: keepgoing-nginx
    restart: unless-stopped
    mem_limit: 128m
    depends_on:
      app:
        condition: service_healthy
    environment:
      NGINX_ENVSUBST_TEMPLATE_DIR: /etc/nginx/templates-http
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
    volumes:
      - ./infra/nginx/keepgoing.conf:/etc/nginx/templates-http/default.conf.template:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - keepgoing-net

  worker:
    image: ${WORKER_IMAGE:-ghcr.io/keepgoing-web/keepgoing-be-worker}:${WORKER_IMAGE_TAG:-latest}
    container_name: keepgoing-worker
    restart: unless-stopped
    mem_limit: 512m
    env_file:
      - ./.env.db
      - ./.env.app
    depends_on:
      redis:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Asia/Seoul}
      REDIS_HOST: redis
      IMAGE_PROCESSING_STREAMS_ENABLED: "true"
    stop_grace_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - keepgoing-net

networks:
  keepgoing-net:
    driver: bridge
