services:
  postgres:
    image: postgres:17-alpine
    container_name: keepgoing-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: Asia/Seoul
    volumes:
      - keepgoing-postgres-data:/var/lib/postgresql/data

  minio:
    image: minio/minio
    container_name: keepgoing-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-keepgoing_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-keepgoing_password}
    command: server /data --console-address ":9001"
    volumes:
      - keepgoing-minio-data:/data

  minio-init:
    image: minio/mc
    container_name: keepgoing-minio-init
    depends_on:
      - minio
    restart: "no"
    entrypoint: >
      /bin/sh -c "
      until mc alias set keepgoing http://minio:9000 ${MINIO_ROOT_USER:-keepgoing_admin} ${MINIO_ROOT_PASSWORD:-keepgoing_password}; do
        echo 'waiting for minio...';
        sleep 2;
      done;
      mc mb --ignore-existing keepgoing/${STORAGE_BUCKET_QUARANTINE:-quarantine-bucket};
      mc mb --ignore-existing keepgoing/${STORAGE_BUCKET_SECURE:-secure-bucket};
      mc anonymous set none keepgoing/${STORAGE_BUCKET_QUARANTINE:-quarantine-bucket};
      mc anonymous set none keepgoing/${STORAGE_BUCKET_SECURE:-secure-bucket};
      "

volumes:
  keepgoing-postgres-data:
  keepgoing-minio-data:
