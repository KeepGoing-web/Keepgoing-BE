services:
  postgres:
    image: postgres:17-alpine
    container_name: keepgoing-postgres
    restart: unless-stopped
    mem_limit: 768m
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: Asia/Seoul
    volumes:
      - keepgoing-postgres-data:/var/lib/postgresql/data

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: keepgoing-minio
    restart: unless-stopped
    mem_limit: 128m
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-keepgoing_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-keepgoing_password}
    command: server /data --console-address ":9001"
    volumes:
      - keepgoing-minio-data:/data

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: keepgoing-minio-init
    depends_on:
      - minio
    restart: "no"
    entrypoint: >
      /bin/sh -c "
      until mc alias set keepgoing http://minio:9000 ${MINIO_ROOT_USER:-keepgoing_admin} ${MINIO_ROOT_PASSWORD:-keepgoing_password}; do
        echo 'waiting for minio...';
        sleep 2;
      done;
      mc mb --ignore-existing keepgoing/${STORAGE_BUCKET_QUARANTINE:-quarantine-bucket};
      mc mb --ignore-existing keepgoing/${STORAGE_BUCKET_SECURE:-secure-bucket};
      mc anonymous set none keepgoing/${STORAGE_BUCKET_QUARANTINE:-quarantine-bucket};
      mc anonymous set none keepgoing/${STORAGE_BUCKET_SECURE:-secure-bucket};
      "

  redis:
    image: redis:7-alpine
    container_name: keepgoing-redis
    restart: unless-stopped
    mem_limit: 128m
    ports:
      - "6379:6379"

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: api-runtime
    container_name: keepgoing-app
    restart: unless-stopped
    mem_limit: 1g
    environment:
      TZ: Asia/Seoul
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/keepgoing
      SPRING_DATASOURCE_USERNAME: keepgoing
      SPRING_DATASOURCE_PASSWORD: keepgoing
      REDIS_HOST: redis
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_ACCESS_KEY: keepgoing_admin
      STORAGE_SECRET_KEY: keepgoing_password
      STORAGE_REGION: us-east-1
      STORAGE_BUCKET_QUARANTINE: quarantine-bucket
      STORAGE_BUCKET_SECURE: secure-bucket
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-local-dev-jwt-secret-key-at-least-32-bytes!}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
      OAUTH_REDIRECT_URI: ${OAUTH_REDIRECT_URI:-http://localhost:3000}
      IMAGE_PROCESSING_STREAMS_ENABLED: "true"
      JAVA_OPTS: "-XX:MaxRAMPercentage=70.0 -XX:ActiveProcessorCount=2 -XX:+UseG1GC -XX:MaxGCPauseMillis=200"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
      minio-init:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker-runtime
    container_name: keepgoing-worker
    restart: unless-stopped
    mem_limit: 512m
    environment:
      TZ: Asia/Seoul
      SPRING_PROFILES_ACTIVE: prod
      REDIS_HOST: redis
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_ACCESS_KEY: keepgoing_admin
      STORAGE_SECRET_KEY: keepgoing_password
      STORAGE_REGION: us-east-1
      STORAGE_BUCKET_QUARANTINE: quarantine-bucket
      STORAGE_BUCKET_SECURE: secure-bucket
      IMAGE_PROCESSING_STREAMS_ENABLED: "true"
      JAVA_OPTS: "-XX:MaxRAMPercentage=70.0 -XX:ActiveProcessorCount=1 -XX:+UseG1GC"
    ports:
      - "8081:8081"
    depends_on:
      redis:
        condition: service_started
      minio-init:
        condition: service_completed_successfully

  redis-exporter:
    image: oliver006/redis_exporter:v1.67.0
    container_name: keepgoing-redis-exporter
    restart: unless-stopped
    mem_limit: 32m
    environment:
      REDIS_ADDR: redis://redis:6379
    command:
      - '--check-single-streams=note-image-processing-requests,note-image-processing-results'
    ports:
      - "9121:9121"
    depends_on:
      - redis

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.20.0
    container_name: keepgoing-postgres-exporter
    restart: unless-stopped
    mem_limit: 64m
    environment:
      DATA_SOURCE_URI: "postgres:5432/${POSTGRES_DB:-keepgoing}?sslmode=disable"
      DATA_SOURCE_USER: "${POSTGRES_USER:-keepgoing}"
      DATA_SOURCE_PASS: "${POSTGRES_PASSWORD:-keepgoing}"
    ports:
      - "9187:9187"
    depends_on:
      postgres:
        condition: service_started

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: keepgoing-node-exporter
    restart: unless-stopped
    mem_limit: 64m
    ports:
      - "9100:9100"
    command:
      - '--path.rootfs=/host'
    volumes:
      - /:/host:ro,rslave
    pid: host

  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: keepgoing-prometheus
    restart: unless-stopped
    mem_limit: 1g
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=7d'
      - '--storage.tsdb.retention.size=5GB'

  alertmanager:
    image: prom/alertmanager:v0.28.0
    container_name: keepgoing-alertmanager
    restart: unless-stopped
    mem_limit: 64m
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./monitoring/alertmanager/discord-webhook-url:/etc/alertmanager/discord-webhook-url:ro
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--log.level=info'

  grafana:
    image: grafana/grafana:11.3.0
    container_name: keepgoing-grafana
    restart: unless-stopped
    mem_limit: 128m
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer

volumes:
  keepgoing-postgres-data:
  keepgoing-minio-data:
