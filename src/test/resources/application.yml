spring:
  application:
    name: keepgoing
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-client
            client-secret: test-secret

  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        generate_statistics: true

  flyway:
    enabled: false

jwt:
  secret-key: "test-secret-key-for-testing-purpose-only-32bytes!!"
  access-token-expiry: 3600000
  refresh-token-expiry: 604800000
  issuer: keepgoing-test

cors:
  allowed-origins:
    - http://localhost:5173
  max-age: 3600

oauth:
  redirect-uri: http://localhost:5173/oauth/callback

auth:
  cookie:
    secure: false
    same-site: Lax
    access-token:
      name: access_token
      path: /api
      max-age: 3600
    refresh-token:
      name: refresh_token
      path: /api/auth
      max-age: 604800
