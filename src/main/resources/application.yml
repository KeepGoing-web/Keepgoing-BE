spring:
  application:
    name: keepgoing
  flyway:
    enabled: false
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${OAUTH_GOOGLE_CLIENT_ID}
            client-secret: ${OAUTH_GOOGLE_CLIENT_SECRET}

  ai:
    logging:
      prompt-response:
        enabled: false


jwt:
  secret-key: ${JWT_SECRET_KEY}
  access-token-expiry: 3600000      # 1시간
  refresh-token-expiry: 604800000   # 7일
  issuer: keepgoing

auth:
  cookie:
    access-token:
      name: access_token
      path: /api
      max-age: 3600
    refresh-token:
      name: refresh_token
      path: /api/auth
      max-age: 604800
