spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  flyway:
    enabled: false

  ai:
    retry:
      max-attempts: 3
      backoff:
        initial-interval: 2s
        multiplier: 2
        max-interval: 10s
      on-client-errors: false

    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: gpt-4o-mini
          temperature: 0.7

    zhipuai:
      api-key: ${ZHIPUAI_API_KEY}
      base-url: ${ZHIPUAI_BASE_URL:https://api.z.ai/api/coding/paas}

      chat:
        options:
          model: glm-5.1
          temperature: 0.7


    logging:
      prompt-response:
        enabled: false

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    org.springframework.ai.chat.client.advisor.SimpleLoggerAdvisor: DEBUG

cors:
  allowed-origins:
    - http://localhost:5173
  max-age: 3600

oauth:
  redirect-uri: http://localhost:5173/oauth/callback

auth:
  cookie:
    secure: false
    same-site: Lax
