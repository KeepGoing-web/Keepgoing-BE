openapi: 3.0.3
info:
  title: Keepgoing API
  version: 1.0.0
  description: |
    블로그 + RAG + 이력서 생성 서비스의 백엔드 API 스펙.
    
    ## 주요 기능
    - 인증/인가 (Auth): JWT 기반 인증
    - 사용자 관리 (User): 프로필 관리, 관리자 기능
    
    ## 인증
    브라우저 환경에서는 HttpOnly 쿠키 기반 JWT 인증을 사용합니다.
    로그인/OAuth 성공 후 서버는 access/refresh 토큰을 쿠키로 설정하며, 클라이언트는 이후 요청에서 쿠키 기반 인증을 사용합니다.
    비브라우저 클라이언트와 수동 테스트에서는 `Authorization: Bearer <token>` 헤더 기반 접근도 사용할 수 있습니다.
    
    ## CSRF 보안
     이 서비스는 브라우저 환경에서 쿠키 기반 인증을 사용할 때 다음과 같은 전략으로 CSRF 위험을 완화합니다.
     - 인증 쿠키는 `HttpOnly`, `Secure`, `SameSite=Lax`(또는 더 엄격한) 옵션으로 설정됩니다.
     - 상태를 변경하는 모든 API는 `GET` 대신 `POST`, `PUT`, `PATCH`, `DELETE` 메서드를 사용합니다.
     - 서버는 별도의 CSRF 토큰 검증 매커니즘을 사용하지 않으므로, 위 정책과 API 설계를 전제로 보안 위협 모델을 구성합니다.
     - 브라우저 클라이언트는 다른 출처에서 이 API를 임베드하여 자동으로 쿠키가 전송되는 패턴을 피해야 합니다.

  contact:
    name: API Support
    email: api@blingbling.com

  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:8080/api/v1
    description: 로컬 개발 서버
  - url: https://api.blingbling.com/v1
    description: 프로덕션 서버

tags:
  - name: Health
    description: 서비스 상태 확인
  - name: Auth
    description: 회원가입, 로그인, 토큰 관리
  - name: Notes
    description: 노트 생성 및 조회
  - name: Users
    description: 사용자 프로필 조회 및 관리

paths:
  # ========== Health Check ==========
  /health:
    get:
      tags: [Health]
      summary: 서비스 상태 확인
      operationId: healthCheck
      security: []
      responses:
        '200':
          description: 서비스 정상
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: healthy
                timestamp: "2024-01-01T00:00:00Z"
                version: "1.0.0"
                checks:
                  database: healthy
                  redis: healthy

  # ========== Auth Endpoints ==========
  /auth/signup:
    post:
      tags: [Auth]
      summary: 회원가입
      operationId: signUp
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUpRequest'
            example:
              email: user@example.com
              name: 홍길동
              password: SecurePass123!
      responses:
        '201':
          description: 회원가입 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignupResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/login:
    post:
      tags: [Auth]
      summary: 로그인
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: user@example.com
              password: SecurePass123!
      responses:
        '200':
          description: 로그인 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/me:
    get:
      tags: [Auth]
      summary: 현재 로그인 사용자 조회
      operationId: getMyInfo
      security:
        - BearerAuth: []
      responses:
        '200':
          description: 현재 로그인 사용자 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyInfoResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /auth/logout:
    post:
      tags: [Auth]
      summary: 로그아웃
      operationId: logout
      security: []
      responses:
        '200':
          description: 로그아웃 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /api/notes:
    post:
      tags: [Notes]
      summary: 노트 생성
      operationId: createNote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoteCreateRequest'
            example:
              folderId: 10
              title: 첫 번째 글 제목
              content: 첫 번째 글 내용입니다.
              visibility: PRIVATE
              aiCollectable: true
      responses:
        '201':
          description: 노트 생성 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoteCreateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
        - BearerAuth: []

  # ========== User Endpoints ==========
  /users/me:
    get:
      tags: [Users]
      summary: 내 정보 조회
      operationId: getMe
      responses:
        '200':
          description: 내 사용자 정보
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
      security:
        - BearerAuth: []

    patch:
      tags: [Users]
      summary: 내 정보 수정
      operationId: updateMe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
            example:
              name: 김철수
              bio: 백엔드 개발자입니다
      responses:
        '200':
          description: 수정 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
      security:
        - BearerAuth: []

    delete:
      tags: [Users]
      summary: 회원 탈퇴
      operationId: deleteMe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteAccountRequest'
      responses:
        '200':
          description: 탈퇴 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      security:
        - BearerAuth: []

  /users/me/change-password:
    post:
      tags: [Users]
      summary: 비밀번호 변경
      operationId: changePassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: 비밀번호 변경 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
      security:
        - BearerAuth: []

  /users:
    get:
      tags: [Users]
      summary: 사용자 목록 조회 (관리자용)
      operationId: listUsers
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 0
            default: 0
          description: 페이지 번호 (0부터 시작)
        - in: query
          name: size
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: 페이지 크기
        - in: query
          name: sort
          schema:
            type: string
            default: createdAt,desc
          description: 정렬 기준 (field,direction)
        - in: query
          name: email
          schema:
            type: string
          description: 이메일 검색 (부분 일치)
        - in: query
          name: status
          schema:
            $ref: '#/components/schemas/UserStatus'
          description: 사용자 상태 필터
      responses:
        '200':
          description: 사용자 목록
          headers:
            X-Total-Count:
              schema:
                type: integer
              description: 전체 사용자 수
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      security:
        - BearerAuth: []

  /users/{id}:
    get:
      tags: [Users]
      summary: 사용자 단건 조회 (관리자용)
      operationId: getUserById
      parameters:
        - $ref: '#/components/parameters/userId'
      responses:
        '200':
          description: 사용자 정보
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
        - BearerAuth: []

    patch:
      tags: [Users]
      summary: 사용자 정보 수정 (관리자용)
      operationId: updateUser
      parameters:
        - $ref: '#/components/parameters/userId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUpdateUserRequest'
      responses:
        '200':
          description: 수정된 사용자 정보
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
        - BearerAuth: []

    delete:
      tags: [Users]
      summary: 사용자 비활성화 (관리자용)
      operationId: deleteUser
      parameters:
        - $ref: '#/components/parameters/userId'
      responses:
        '200':
          description: 비활성화 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
        - BearerAuth: []

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT 액세스 토큰

  parameters:
    userId:
      in: path
      name: id
      required: true
      schema:
        type: integer
        format: int64
      description: 사용자 ID

  responses:
    BadRequest:
      description: 잘못된 요청 (유효성 검사 실패)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
          example:
            success: false
            error:
              code: VALIDATION_FAILED
              message: 입력값 검증 실패
              details:
                - field: email
                  message: 올바른 이메일 형식이 아닙니다
            timestamp: "2024-01-01T00:00:00Z"
            path: /auth/signup

    Unauthorized:
      description: 인증 실패
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
          example:
            success: false
            error:
              code: AUTH_TOKEN_INVALID
              message: 유효하지 않은 토큰입니다
            timestamp: "2024-01-01T00:00:00Z"
            path: /users/me

    Forbidden:
      description: 권한 없음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
          example:
            success: false
            error:
              code: PERMISSION_DENIED
              message: 해당 리소스에 접근할 권한이 없습니다
            timestamp: "2024-01-01T00:00:00Z"
            path: /users

    NotFound:
      description: 리소스를 찾을 수 없음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
          example:
            success: false
            error:
              code: USER_NOT_FOUND
              message: 사용자를 찾을 수 없습니다
            timestamp: "2024-01-01T00:00:00Z"
            path: /users/123

    Conflict:
      description: 리소스 충돌
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
          example:
            success: false
            error:
              code: USER_ALREADY_EXISTS
              message: 이미 존재하는 이메일입니다
            timestamp: "2024-01-01T00:00:00Z"
            path: /auth/signup

    TooManyRequests:
      description: 요청 횟수 초과
      headers:
        X-RateLimit-Limit:
          schema:
            type: integer
          description: 제한 횟수
        X-RateLimit-Remaining:
          schema:
            type: integer
          description: 남은 요청 횟수
        X-RateLimit-Reset:
          schema:
            type: integer
          description: 리셋 시간 (Unix timestamp)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
          example:
            success: false
            error:
              code: RATE_LIMIT_EXCEEDED
              message: 요청 횟수가 초과되었습니다. 잠시 후 다시 시도해주세요
            timestamp: "2024-01-01T00:00:00Z"
            path: /auth/login

    InternalServerError:
      description: 서버 내부 오류
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
          example:
            success: false
            error:
              code: INTERNAL_SERVER_ERROR
              message: 서버 오류가 발생했습니다. 잠시 후 다시 시도해주세요
            timestamp: "2024-01-01T00:00:00Z"
            path: /users/me

  schemas:
    # ========== Common Schemas ==========
    ApiResponse:
      type: object
      properties:
        success:
          type: boolean
          description: 요청 성공 여부
        data:
          type: object
          nullable: true
          description: 성공 시 응답 데이터
        error:
          $ref: '#/components/schemas/ErrorDetail'
        timestamp:
          type: string
          format: date-time
          description: 응답 시간
        path:
          type: string
          description: 요청 경로
        requestId:
          type: string
          description: 요청 추적 ID
          example: "req_1234567890"
      required: [success, timestamp, path]

    ErrorDetail:
      type: object
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          description: 에러 메시지
        field:
          type: string
          nullable: true
          description: 유효성 검사 실패 필드
        details:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
          nullable: true
          description: 상세 에러 정보
      required: [code, message]

    ErrorCode:
      type: string
      enum:
        # Auth errors
        - AUTH_INVALID_CREDENTIALS
        - AUTH_TOKEN_EXPIRED
        - AUTH_TOKEN_INVALID
        - AUTH_REFRESH_TOKEN_INVALID
        - AUTH_EMAIL_NOT_VERIFIED
        # User errors
        - USER_NOT_FOUND
        - USER_ALREADY_EXISTS
        - USER_SUSPENDED
        - USER_DELETED
        # Note / Folder errors
        - NOTE_NOT_FOUND
        - NOTE_ACCESS_DENIED
        - FOLDER_NOT_FOUND
        - FOLDER_ACCESS_DENIED
        # Validation errors
        - VALIDATION_FAILED
        - INVALID_INPUT
        - INVALID_PASSWORD_FORMAT
        - PASSWORD_TOO_WEAK
        # Permission errors
        - PERMISSION_DENIED
        - ROLE_INSUFFICIENT
        # Rate limit
        - RATE_LIMIT_EXCEEDED
        # System errors
        - INTERNAL_SERVER_ERROR
        - SERVICE_UNAVAILABLE
        - RESOURCE_NOT_FOUND

    PageMeta:
      type: object
      properties:
        page:
          type: integer
          description: 현재 페이지 (0부터 시작)
        size:
          type: integer
          description: 페이지 크기
        totalElements:
          type: integer
          format: int64
          description: 전체 항목 수
        totalPages:
          type: integer
          description: 전체 페이지 수
        hasNext:
          type: boolean
          description: 다음 페이지 존재 여부
        hasPrevious:
          type: boolean
          description: 이전 페이지 존재 여부
        first:
          type: boolean
          description: 첫 페이지 여부
        last:
          type: boolean
          description: 마지막 페이지 여부
      required: [page, size, totalElements, totalPages, hasNext, hasPrevious, first, last]

    # ========== Health Schemas ==========
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum: [healthy, degraded, unhealthy]
        timestamp:
          type: string
          format: date-time
        version:
          type: string
        checks:
          type: object
          additionalProperties:
            type: string
            enum: [healthy, unhealthy]
      required: [status, timestamp, version]

    # ========== Auth Schemas ==========
    SignUpRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          description: 사용자 이메일
        name:
          type: string
          minLength: 2
          maxLength: 50
          description: 사용자 이름
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 100
          pattern: '^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}$'
          description: |
            비밀번호 (최소 8자, 대소문자, 숫자, 특수문자 포함)
      required: [email, name, password]

    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
      required: [email, password]

    SignupResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                id:
                  type: integer
                  format: int64
                email:
                  type: string
                  format: email
                name:
                  type: string
              required: [id, email, name]

    LoginResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                userId:
                  type: integer
                  format: int64
                email:
                  type: string
                  format: email
              required: [userId, email]

    MyInfoResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                userId:
                  type: integer
                  format: int64
                email:
                  type: string
                  format: email
                name:
                  type: string
                role:
                  $ref: '#/components/schemas/UserRole'
              required: [userId, email, name, role]

    # ========== Note Schemas ==========
    NoteVisibility:
      type: string
      enum: [PRIVATE, PUBLIC]
      description: 노트 공개 범위

    NoteCreateRequest:
      type: object
      properties:
        folderId:
          type: integer
          format: int64
          nullable: true
          description: 생성할 노트가 속할 폴더 ID. null이면 루트에 생성됩니다.
        title:
          type: string
          maxLength: 200
          description: 노트 제목
        content:
          type: string
          description: 노트 본문
        visibility:
          $ref: '#/components/schemas/NoteVisibility'
        aiCollectable:
          type: boolean
          description: AI 수집 가능 여부
      required: [title, content]

    NoteDetailData:
      type: object
      properties:
        noteId:
          type: integer
          format: int64
        folderId:
          type: integer
          format: int64
          nullable: true
          description: 노트가 속한 폴더 ID. 루트 노트면 null입니다.
        userId:
          type: integer
          format: int64
        title:
          type: string
        content:
          type: string
        visibility:
          $ref: '#/components/schemas/NoteVisibility'
        aiCollectable:
          type: boolean
        createdAt:
          type: string
          format: date-time
          nullable: true
        updatedAt:
          type: string
          format: date-time
          nullable: true
      required: [noteId, userId, title, content, visibility, aiCollectable]

    NoteCreateResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/NoteDetailData'

    # ========== User Schemas ==========
    UserRole:
      type: string
      enum: [USER, ADMIN]
      description: 사용자 권한

    UserStatus:
      type: string
      enum: [ACTIVE, SUSPENDED, DELETED]
      description: 사용자 상태

    UserDetail:
      type: object
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
          format: email
        name:
          type: string
        bio:
          type: string
          nullable: true
          description: 자기소개
        profileImageUrl:
          type: string
          nullable: true
          description: 프로필 이미지 URL
        role:
          $ref: '#/components/schemas/UserRole'
        status:
          $ref: '#/components/schemas/UserStatus'
        emailVerified:
          type: boolean
          description: 이메일 인증 여부
        lastLoginAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, email, name, role, status, emailVerified, createdAt, updatedAt]

    UserSummary:
      type: object
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
          format: email
        name:
          type: string
        profileImageUrl:
          type: string
          nullable: true
        role:
          $ref: '#/components/schemas/UserRole'
        status:
          $ref: '#/components/schemas/UserStatus'
        emailVerified:
          type: boolean
        lastLoginAt:
          type: string
          format: date-time
          nullable: true
      required: [id, email, name, role, status, emailVerified]

    UserResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/UserDetail'

    UserPageResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                items:
                  type: array
                  items:
                    $ref: '#/components/schemas/UserSummary'
                meta:
                  $ref: '#/components/schemas/PageMeta'
              required: [items, meta]

    UpdateProfileRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 50
        bio:
          type: string
          maxLength: 500
        profileImageUrl:
          type: string
          format: uri
      description: 프로필 수정 요청 (모든 필드 선택적)

    ChangePasswordRequest:
      type: object
      properties:
        currentPassword:
          type: string
          format: password
        newPassword:
          type: string
          format: password
          minLength: 8
          pattern: '^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}$'
      required: [currentPassword, newPassword]

    DeleteAccountRequest:
      type: object
      properties:
        password:
          type: string
          format: password
          description: 본인 확인을 위한 비밀번호
        reason:
          type: string
          maxLength: 500
          description: 탈퇴 사유 (선택)
      required: [password]

    AdminUpdateUserRequest:
      type: object
      properties:
        name:
          type: string
        role:
          $ref: '#/components/schemas/UserRole'
        status:
          $ref: '#/components/schemas/UserStatus'
        emailVerified:
          type: boolean
      description: 관리자용 사용자 수정 요청
