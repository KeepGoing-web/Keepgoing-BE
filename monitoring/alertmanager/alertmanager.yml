global:
  resolve_timeout: 5m
  # SMTP settings (uncomment and configure for email alerts):
  # smtp_smarthost: 'smtp.example.com:587'
  # smtp_from: 'alertmanager@keepgoing.app'
  # smtp_auth_username: 'alertmanager@keepgoing.app'
  # smtp_auth_password: 'CHANGE_ME'

route:
  group_by: ['alertname', 'job']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'default'

receivers:
  - name: 'default'
    discord_configs:
      - webhook_url_file: /etc/alertmanager/discord-webhook-url
        title: '{{ .GroupLabels.alertname }}'
        message: '{{ .CommonAnnotations.description }}'
        send_resolved: true
