global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - 'alert-rules.yml'

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 'alertmanager:9093'

scrape_configs:
  - job_name: 'keepgoing-api'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - 'app:8080'
        labels:
          application: 'keepgoing-api'

  - job_name: 'keepgoing-worker'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - 'worker:8081'
        labels:
          application: 'keepgoing-worker'

  - job_name: 'redis'
    static_configs:
      - targets:
          - 'redis-exporter:9121'
        labels:
          application: 'keepgoing-redis'

  - job_name: 'postgres'
    static_configs:
      - targets:
          - 'postgres-exporter:9187'
        labels:
          application: 'keepgoing-postgres'

  - job_name: 'node'
    static_configs:
      - targets:
          - 'node-exporter:9100'
        labels:
          application: 'keepgoing-host'

  - job_name: 'nginx'
    static_configs:
      - targets:
          - 'nginx:9113'
        labels:
          application: 'keepgoing-nginx'
