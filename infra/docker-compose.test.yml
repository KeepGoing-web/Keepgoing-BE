services:
  test-postgres:
    image: postgres:17-alpine
    container_name: keepgoing-test-postgres
    restart: unless-stopped
    shm_size: 256m
    mem_limit: 512m
    env_file:
      - ./.env.db.test
    environment:
      TZ: ${TZ:-Asia/Seoul}
    volumes:
      - test-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - keepgoing-test-net

  test-redis:
    image: redis:7-alpine
    container_name: keepgoing-test-redis
    restart: unless-stopped
    mem_limit: 128m
    volumes:
      - test-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - keepgoing-test-net

  test-app:
    image: ${APP_IMAGE:-ghcr.io/keepgoing-web/keepgoing-be-api}:${APP_IMAGE_TAG:-latest}
    container_name: keepgoing-test-app
    restart: unless-stopped
    mem_limit: 768m
    env_file:
      - ./.env.db.test
      - ./.env.app.test
    depends_on:
      test-postgres:
        condition: service_healthy
      test-redis:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Asia/Seoul}
      REDIS_HOST: test-redis
      IMAGE_PROCESSING_STREAMS_ENABLED: "true"
    ports:
      - "127.0.0.1:${TEST_APP_PORT:-8082}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/actuator/health | grep '\"status\":\"UP\"' > /dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    networks:
      - keepgoing-test-net

  test-worker:
    image: ${WORKER_IMAGE:-ghcr.io/keepgoing-web/keepgoing-be-worker}:${WORKER_IMAGE_TAG:-latest}
    container_name: keepgoing-test-worker
    restart: unless-stopped
    mem_limit: 512m
    env_file:
      - ./.env.db.test
      - ./.env.app.test
    depends_on:
      test-redis:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Asia/Seoul}
      REDIS_HOST: test-redis
      IMAGE_PROCESSING_STREAMS_ENABLED: "true"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8081/actuator/health | grep '\"status\":\"UP\"' > /dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    stop_grace_period: 60s
    networks:
      - keepgoing-test-net

  # ----- Monitoring Stack -----
  test-prometheus:
    image: prom/prometheus:v2.55.0
    container_name: keepgoing-test-prometheus
    restart: unless-stopped
    mem_limit: 256m
    ports:
      - "127.0.0.1:9091:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.test.yml:/etc/prometheus/prometheus.yml:ro
      - test-prometheus-data:/prometheus
    command:
        - '--config.file=/etc/prometheus/prometheus.yml'
        - '--storage.tsdb.path=/prometheus'
        - '--web.enable-remote-write-receiver'
    networks:
      keepgoing-test-net:
        aliases:
          - prometheus

  test-grafana:
    image: grafana/grafana:9.5.1
    container_name: keepgoing-test-grafana
    restart: unless-stopped
    mem_limit: 128m
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - test-grafana-data:/var/lib/grafana
    networks:
      - keepgoing-test-net

  test-redis-exporter:
    image: oliver006/redis_exporter:v1.67.0
    container_name: keepgoing-test-redis-exporter
    restart: unless-stopped
    mem_limit: 64m
    environment:
      REDIS_ADDR: redis://test-redis:6379
    networks:
      - keepgoing-test-net

  test-postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.16.0
    container_name: keepgoing-test-postgres-exporter
    restart: unless-stopped
    mem_limit: 64m
    environment:
      DATA_SOURCE_NAME: "postgresql://${TEST_DB_USER:-keepgoing}:${TEST_DB_PASSWORD:-keepgoing}@test-postgres:5432/${TEST_DB_NAME:-keepgoing}?sslmode=disable"
    depends_on:
      test-postgres:
        condition: service_healthy
    networks:
      - keepgoing-test-net

volumes:
  test-postgres-data:
  test-redis-data:
  test-prometheus-data:
  test-grafana-data:
  test-postgres-exporter-data:

networks:
  keepgoing-test-net:
    driver: bridge