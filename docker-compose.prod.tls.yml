services:
  nginx:
    environment:
      NGINX_ENVSUBST_TEMPLATE_DIR: /etc/nginx/templates-tls
      NGINX_SERVER_NAME: ${NGINX_SERVER_NAME}
      NGINX_CERT_NAME: ${NGINX_CERT_NAME}
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./infra/nginx/keepgoing.tls.conf.template:/etc/nginx/templates-tls/default.conf.template:ro
      - ${TLS_CERTS_DIR:-./var/certs}:/etc/letsencrypt:ro
      - ${TLS_ACME_CHALLENGE_DIR:-./var/www/certbot}:/var/www/certbot:ro

  certbot:
    image: certbot/certbot:latest
    container_name: keepgoing-certbot
    restart: unless-stopped
    volumes:
      - ${TLS_CERTS_DIR:-./var/certs}:/etc/letsencrypt
      - ${TLS_ACME_CHALLENGE_DIR:-./var/www/certbot}:/var/www/certbot
    entrypoint: >-
      /bin/sh -c "trap exit TERM;
      while :; do
        certbot renew --webroot -w /var/www/certbot --quiet;
        sleep 12h & wait $$!;
      done"
